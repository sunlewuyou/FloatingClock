name: Build and Release APK

on:
  push:
    tags: ['*']
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag name for release (e.g., v0.3.0)'
        required: true
        type: string
      prerelease:
        description: 'Mark as pre-release'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build-and-release:
    name: Build & Release APK
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      LANG: C.UTF-8
      JAVA_HOME: /usr/lib/jvm/java-17-openjdk-amd64
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      ANDROID_HOME: /usr/local/lib/android/sdk

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.7'
          channel: stable
          cache: true

      - name: Show tool versions
        run: |
          flutter --version
          java -version
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

      - name: Ensure Android platform & build-tools (API 36)
        run: |
          export PATH="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$PATH"
          yes | sdkmanager --sdk_root="$ANDROID_SDK_ROOT" --licenses >/dev/null 2>&1 || true
          sdkmanager --sdk_root="$ANDROID_SDK_ROOT" \
            "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Flutter pub get
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test --reporter expanded

      - name: Decode signing keystore
        run: |
          set -euo pipefail
          : "${KEYSTORE_BASE64:?missing}" "${KEYSTORE_PASSWORD:?missing}" \
            "${KEY_PASSWORD:?missing}" "${KEY_ALIAS:?missing}"
          printf '%s' "$KEYSTORE_BASE64" | tr -d '\r\n' | base64 -d > android/android.jks
          test -s android/android.jks
          keytool -list -keystore android/android.jks \
            -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null
          echo "✓ keystore OK"
          {
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyPassword=$KEY_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "storeFile=android.jks"
          } > android/key.properties
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}

      - name: Build release APK (split per ABI)
        run: flutter build apk --release --split-per-abi

      - name: Rename APKs
        id: rename
        run: |
          cd build/app/outputs/apk/release
          shopt -s nullglob
          out=()
          for f in app-*-release.apk; do
            abi=${f#app-}; abi=${abi%-release.apk}
            mv "$f" "FloatingClock-android-${abi}.apk"
            out+=("FloatingClock-android-${abi}.apk")
          done
          ((${#out[@]})) || { echo "no APK produced"; exit 1; }
          printf '%s\n' "${out[@]}"

      - name: Clean up secrets
        if: always()
        run: rm -f android/android.jks android/key.properties

      - name: Upload artifacts
        uses: actions/upload-artifact@v5
        with:
          name: app-release-apk
          path: build/app/outputs/apk/release/FloatingClock-android-*.apk
          retention-days: 1

      - name: Create GitHub Release
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ inputs.tag_name || github.ref_name }}
          name: Release ${{ inputs.tag_name || github.ref_name }}
          files: build/app/outputs/apk/release/FloatingClock-android-*.apk
          generate_release_notes: true
          prerelease: >-
            ${{ contains(inputs.tag_name || github.ref_name, '-alpha') ||
               contains(inputs.tag_name || github.ref_name, '-beta') ||
               contains(inputs.tag_name || github.ref_name, '-rc') ||
               inputs.prerelease }}
